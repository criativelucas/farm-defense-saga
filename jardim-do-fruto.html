<meta charset="utf-8">
<title>Farm Defense Saga</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2f6a2a">
<link rel="icon" href="assets/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Pixelify+Sans:wght@400;600;700&display=swap">
<link rel="stylesheet" href="css/style.css">
<script>let BOOT=0;function bootStep(){const e=document.querySelector('#boot em');if(e)e.style.width=Math.min(100,++BOOT/23*100)+'%'}</script>

<div id="wrap"><div id="stage">
  <div id="boot"><img src="assets/logo.png" alt=""><i><em></em></i><small>Carregando o jardim…</small></div>
  <canvas id="c" width="770" height="432"></canvas>
  <canvas id="glow" width="385" height="216"></canvas>
  <div id="hud" hidden>
    <div class="hud" id="hudL">
      <div id="hearts"></div>
      <div class="bar"><span class="lbl">Éden</span><b><i id="hpfill"></i></b><span id="hptxt">20</span></div>
      <div id="fruits"></div><div id="setb"></div><div id="tal" hidden></div><div id="storyhud"></div>
    </div>
    <div class="hud" id="hudR">
      <div class="hudbtns"><button type="button" id="bpause" title="Pausa (Esc)">II</button><button type="button" id="bspeed" title="Velocidade (F)">1x</button><button type="button" id="bfull" title="Tela cheia">⛶</button></div><div id="wname">Onda 1</div><div id="wbar"><i id="wfill"></i></div>
      <div id="timer" role="button" tabindex="0" hidden></div><div id="preview" hidden></div>
    </div>
    <div id="boss" hidden><span id="bname"></span><b><i id="bfill"></i></b></div>
  </div>
  <div id="banner"><small id="bsmall"></small><strong id="bbig"></strong></div>
  <div id="tut" hidden></div><div id="tutarrow" hidden></div>
  <div id="story" hidden></div>
  <div id="hand" hidden><div id="mbar"><i id="mfill"></i><span id="mtxt">0</span></div>
    <div id="handrow"><div id="pile" class="cardback" title="Monte de compra"><b id="pilecount">0</b><small>monte</small></div><div id="cards"></div><div id="nextc" class="nextc"></div></div></div>
  <div id="itembar"></div>
  <div id="touch">
    <div><button data-k="ArrowLeft">←</button><button data-k="ArrowRight">→</button></div>
    <div><button data-k="KeyC">Poder</button><button data-k="KeyX">Golpe</button><button data-k="ArrowDown">Pisão</button><button data-k="ArrowUp">Pular</button></div>
  </div>
  <div id="menu"></div>
  <div id="toast" hidden></div>
  <div id="foeintro" hidden></div>
  <div id="pause" hidden></div>
  <div id="bossintro" hidden></div>
  <div id="dialog" hidden></div>
  <div id="wipe" style="display:none"><div class="wiris"></div><div class="wleaves"><i style="--x:8%;--d:0s;--s:1"></i><i style="--x:22%;--d:0.08s;--s:0.7"></i><i style="--x:37%;--d:0.03s;--s:1.2"></i><i style="--x:51%;--d:0.12s;--s:0.8"></i><i style="--x:64%;--d:0.05s;--s:1"></i><i style="--x:78%;--d:0.1s;--s:0.6"></i><i style="--x:91%;--d:0.02s;--s:1.1"></i><i style="--x:30%;--d:0.15s;--s:0.9"></i><i style="--x:70%;--d:0.17s;--s:0.7"></i></div><div class="wemb"><canvas id="wipec" width="96" height="96"></canvas></div></div>
  <div id="treeinfo" hidden></div>
  <div id="cardtip" hidden></div>
</div></div>

<script src="js/engine.js" onload="bootStep()"></script>
<script src="js/skin.js" onload="bootStep()"></script>
<script src="js/content.js" onload="bootStep()"></script>
<script src="js/maps.js" onload="bootStep()"></script>
<script src="js/tiles.js" onload="bootStep()"></script>
<script src="js/scenery.js" onload="bootStep()"></script>
<script src="js/terrain.js" onload="bootStep()"></script>
<script src="js/game.js" onload="bootStep()"></script>
<script src="js/draw.js" onload="bootStep()"></script>
<script src="js/sprites.js" onload="bootStep()"></script>
<script src="js/vfx.js" onload="bootStep()"></script>
<script src="js/ui.js" onload="bootStep()"></script>
<script src="js/cards.js" onload="bootStep()"></script>
<script src="js/meta.js" onload="bootStep()"></script>
<script src="js/goals.js" onload="bootStep()"></script><script src="js/bosses.js" onload="bootStep()"></script>
<script src="js/minigames.js" onload="bootStep()"></script>
<script src="js/td.js" onload="bootStep()"></script>
<script src="js/extras.js" onload="bootStep()"></script>
<script src="js/platform.js" onload="bootStep()"></script>
<script src="js/garden.js" onload="bootStep()"></script>
<script src="js/icons.js" onload="bootStep()"></script>
<script src="js/aseprite.js" onload="bootStep()"></script>
